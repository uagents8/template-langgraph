name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run catches a dependency or LangGraph release before a new user does.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Smoke test
        run: pytest -q
      - name: Start the server and call it
        run: |
          PORT=8123 python main.py &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8123/ && break
            sleep 0.5
          done
          curl -fsS -X POST http://127.0.0.1:8123/chat -H 'Content-Type: application/json' \
            -d '{"message": "what is 2+3*4?"}'
          kill %1
